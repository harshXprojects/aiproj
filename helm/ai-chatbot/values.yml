backend:
  replicaCount: 2

  image:
    repository: singhharshmeet/ai-chatbot-backend
    tag: v2
    pullPolicy: IfNotPresent

  service:
    port: 8000

  ollamaUrl: "http://host.docker.internal:11434/api/generate"
  modelName: "llama3.2:3b"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 2

  image:
    repository: singhharshmeet/ai-chatbot
    tag: v2
    pullPolicy: IfNotPresent

  service:
    port: 80

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
