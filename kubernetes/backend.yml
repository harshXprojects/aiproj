apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-proj
  labels:
    app: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: singhharshmeet/ai-chatbot-backend:v1
          ports:
              - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-proj
spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
